# CI GitLab - verification lint + build + test
image: node:22

stages:
  - verify
  - test
  - security

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

lint:
  stage: verify
  script:
    - npm ci --cache .npm --prefer-offline
    - npx tsc --noEmit
    # Le contrat du pipeline est VERIFIE, pas raconte : voir scripts/verify-ci.mjs.
    # Placici et non dans e2e-test : le job doit pouvoir rougir avant qu'on paie
    # l'install des navigateurs, et l'enumcration des specs ne les exige pas (mesuré
    # rc=0 avec PLAYWRIGHT_BROWSERS_PATH vide).
    - npm run verify:ci

build:
  stage: verify
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# --- Tests ---
# Unitaires (vitest) : utilitaires partagés (safeJsonParse, prix, matching flou, modèle Ollama).
unit-test:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    # Les poids OCR (12,8 Mo) ne sont pas sous git (contrat du 25/09 : la
    # lourdeur que le depot refuse). Le test du banc les exige : le job les
    # relit au package registry du projet (ocr-modeles/v2) et chaque poids est
    # juge par empreinte contre scripts/modeles-ocr.manifest.json avant vitest.
    # Morsure verifiee 28/09: dossier de poids retire, le script les rend
    # 3/3 CONFORMES par telechargement reel. Sans eux, unit-test rouge de fait.
    - python3 scripts/telecharger-ocr-modeles.py
    - npx vitest run

# E2E (Playwright) : démarre le serveur Express (tsx) sur un port isolé et
# vérifie les routes critiques (CRUD inventaire, licence, dashboard, HACCP).
# Le runner doit permettre les ports locaux (pas de problème sur runner docker).
e2e-test:
  stage: test
  # ⚠ Deux dependances du runner, chacune acquise par une MESURE et non par
  # supposition. Le pipeline #2831926289 a rougi sur la premiere; la seconde au
  # aurait fait rougir le pipeline suivant.

  # 1) needs: [build] -- test/e2e/motion-animation.spec.ts lit dist/index.html et
  #    demarre en NODE_ENV=production, la seule branche qui sert le vrai bundle.
  #    Sans l'artefact du job build, son beforeAll jette « dist/ absent » et le
  #    reste de la suite ne s'execute meme pas. Le piege etait total en local:
  #    dist/ traine dans l'arbre de developpement, donc la suite etait verte ici
  #    et rouge la haut. On le verifie en RETIRANT l'artefact:
  #      mv dist .hold && npx playwright test   # doit rougir sur 'dist/ absent'

  # 2) playwright install --with-deps -- seul ce spec utilise le fixture 'page'
  #    (la suite historique n'utilise que le fixture 'request', qui ne lance
  #    aucun navigateur), et l'image node:22 n'embarque NI les navigateurs NI
  #    leurs bibliotheques systeme. Mesure dans un conteneur node:22 -- la meme
  #    image que la CI -- en construisant dist/ dans le conteneur pour ne pas
  #    confondre les deux causes (la 1ere campagne, sans dist/, etait contaminee):
  #      sans install              rc=1  'Executable does not exist'
  #      install                   rc=0  PUIS le spec: rc=1  <-- NE SUFFIT PAS
  #      install --with-deps       rc=0  PUIS le spec: rc=0
  #      suite complete            rc=0  (32 tests)
  #    Le 'rc=1' du milieu est le point qui compte: sans --with-deps les libs
  #    systeme de Chromium manquent et le job reste ROUGE. scripts/verify-ci.mjs
  #    verrouille desormais cette regle pour qu'elle ne se perde plus en silence.
  needs: [build]
  script:
    - npm ci --cache .npm --prefer-offline
    # --with-deps installe les libs systeme que Chromium exige. Verifie dans le
    # conteneur: uid=0 et /usr/bin/apt-get presents dans node:22.
    - npx playwright install --with-deps
    - npx playwright test
  # ⚠ `when: always` est le MOT QUI COMPTE. Sans lui GitLab ne collecte rien
  # quand le job rougit : or c'est exactement le seul cas ou la preuve sert.
  # Le pipeline #2833166731 a eu un job rouge SANS aucune trace exploitable
  # (aucun artifact declare) : la cause a du etre devinee par reproduction
  # locale au lieu d'etre lue. test-results/ porte, pour chaque test en
  # echec, error-context.md + la capture + la trace rejouable.
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - test-results/
# Preuves terrain (verify:*). Ces scripts ne testent pas une fonction, ils
# empechent un REGRESSION de contrat : latence par route, gzip + cache des assets,
# diffusion SSE, budgets de rate-limit, et poids du chunk d'entree. Ils demarrent
# leur propre serveur sur un port isole (comme la suite e2e) et exigent le `dist`
# reel pour ceux qui exercent la branche `NODE_ENV=production` -> artifacts dist/.
# Un reglage de perf qui change sans passer par la est un reglage non verifie.
verify-test:
  stage: test
  needs: [build]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run verify:bundle
    - npm run verify:http
    - npm run verify:perf
    - npm run verify:sse
    - npm run verify:ratelimit
  artifacts:
    paths:
      - dist/
    when: always

# --- Securite (signalement des erreurs, comme l'onglet Security de GitHub) ---
# Dependency Scanning : l'equivalent Dependabot — lit package-lock.json et
# signale les dependances vulnerables (ex. protobufjs CVSS 9.8, tar, detectes
# par npm audit le 02/10) dans le widget Security de chaque Merge Request.
dependency-scanning:
  stage: security
  allow_failure: true   # signale sans bloquer ; passer a false pour bloquer les MR
  artifacts:
    when: always
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    paths: [gl-dependency-scanning-report.json]

# Analyse statique du code (injections SQL, XSS, chemins...) sur les MR.
sast:
  stage: security
  allow_failure: true
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
    paths: [gl-sast-report.json]

# Detection de secrets commits (cle API, mot de passe...) dans le depot.
secret-detection:
  stage: security
  allow_failure: true
  artifacts:
    when: always
    reports:
      secret_detection: gl-secret-detection-report.json
    paths: [gl-secret-detection-report.json]

# Barriere dure npm audit : rouge si une vulnerabilite high ou critical est
# presente. Independant des scanners GitLab, marche sur tout plan (Free inclus).
npm-audit:
  stage: security
  script:
    - npm audit --audit-level=high
