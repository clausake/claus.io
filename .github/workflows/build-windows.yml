# Installeurs des trois plateformes — chacun compile sur son hote NATIF.
#
# Windows x64 : sur un vrai hote Windows (makensis casse en EPIPE depuis Linux,
#               et le cross-compile arm64->x64 est refuse pour les modules natifs).
# macOS arm64 : sur un runner Apple (une regle de facto d'Apple pour les images disque).
# Linux arm64 : sur un runner ARM (le cross-compile x64->arm64 est refuse pour
#               sqlite3/argon2/onnxruntime/@napi-rs/canvas).
#
# Declencheurs :
#   - manuel (workflow_dispatch) pour la release en cours ;
#   - à chaque tag v* pour les releases suivantes.
# L'attache à la release LIT la version de package.json pour un déclenchement
# manuel (le dispatch ne porte pas de tag) : un numéro figé à la main attacherait
# les installeurs neufs à l'ANCIENNE release — exactement ce qui est arrivé à
# v0.1.0, dont les assets ont été remplacés au fil des corrections sans que la
# version annoncée bouge. Le tag porté par le déclencheur v* reste la référence
# quand il existe.

name: installateurs

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Bug npm #4828 : les dépendances optionnelles par-plateforme (rollup,
      # esbuild) ne sont pas installées si le lockfile a été généré ailleurs.
      # On installe nos petits binaires natifs Windows à plat sans toucher au
      # lockfile (le poste local est Linux).
      - name: native rollup/esbuild (npm bug #4828)
        run: npm i --no-save @rollup/rollup-win32-x64-msvc @esbuild/win32-x64

      # electron-rebuild ne reconnaît pas les noms de prébuilds NAPI modernes
      # d'argon2 (0.45 livre « argon2.glibc.node », le détecteur cherche
      # « node.napi.node ») : sans la copie, il retombe sur node-gyp et exige
      # Visual Studio. La copie est device-independante : NAPI s'exécute tel
      # quel sous Electron.
      - name: argon2 — prébuild NAPI visible par electron-rebuild
        shell: bash
        run: |
          cp node_modules/argon2/prebuilds/win32-x64/argon2.glibc.node \
             node_modules/argon2/prebuilds/win32-x64/node.napi.node

      - run: npm run build

      - run: npm run build:server

      - name: electron-builder NSIS (x64, sans publication)
        run: npx electron-builder -w --publish never

      - name: à quelle release rattacher
        id: rel
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: attacher l'installeur à la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: release/*.exe

  build-mac:
    # Le .dmg ne se compile QUE sur une machine Apple (une règle de facto
    # d'Apple sur les outils de création d'images disque macOS) : on passe
    # par un runner GitHub Actions Apple Silicon (macOS 14/15 arm64).
    # Sans certificat de développeur Apple : le .dmg est non signé, l'utilisateur
    # devra confirmer à la main à la première ouverture (clic droit → Ouvrir).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le même bug npm #4828 que sous Windows : les paquets optionnels par
      # plateforme (rollup, esbuild) manquent si le lockfile a été généré
      # ailleurs. Le runner est Apple Silicon (darwin-arm64).
      - name: native rollup/esbuild (npm bug #4828)
        run: npm i --no-save @rollup/rollup-darwin-arm64 @esbuild/darwin-arm64

      - run: npm run build

      - run: npm run build:server

      - name: electron-builder DMG (Apple Silicon, sans publication)
        run: npx electron-builder -m --publish never

      - name: à quelle release rattacher
        id: rel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: attacher l'installeur à la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: release/*.dmg

  build-linux:
    # Linux ARM64 (AppImage + deb) — construit sur un runner ARM natif.
    #
    # POURQUOI CE JOB EXISTE (defaut mesure le 30/10 sur la release v0.1.1) :
    # le README annoncait des installeurs Linux attaches, mais la release ne
    # portait que le .exe et le .dmg — les AppImage/.deb avaient ete construits
    # a la main sur le poste arm64 et jamais pousses. Un utilisateur Linux qui
    # suivait le README (« prendre 0.1.1 ou plus recent ») retombait donc sur la
    # 0.1.0, celle qui ouvre « Not Found » (chantier 20). Les deux assets 0.1.1
    # ont ete rattaches a la main le 31/10 ; ce job empeche la recidive.
    #
    # Pourquoi un runner ARM et pas ubuntu-latest (x64) : le cross-compile
    # x64->arm64 est impossible pour les modules natifs (sqlite3, argon2,
    # onnxruntime, @napi-rs/canvas) — npm ci installerait les binaires x64.
    # Les runners ARM heberges sont disponibles pour les depots publics.
    runs-on: ubuntu-24.04-arm
    # Meme raison que dans ci.yml : le postinstall de onnxruntime-node telecharge
    # les providers CUDA/TensorRT depuis le CDN Microsoft, injoignable depuis le
    # runner (ETIMEDOUT). Les binaires CPU linux/arm64 sont deja dans le paquet.
    env:
      ONNXRUNTIME_NODE_INSTALL: "skip"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run build:server

      - name: electron-builder AppImage + deb (arm64, sans publication)
        run: npx electron-builder -l --publish never

      # ── E1 : smoke test de l'installeur (plan docs/plan-chantier-qwen-2026-11-02-v012.md)
      #
      # Le serveur EMPAQUETE doit repondre : on lance le VRAI AppImage (jamais
      # `tsx server.ts` du source) sous xvfb et on sonde son API. Un smoke en
      # continue-on-error, ou un vert sans sonde, est INTERDIT par le plan.
      # Il vit AVANT l'attache a la release : un installeur dont le serveur ne
      # repond pas ne doit pas etre publie (c'etait le defaut v0.1.0 : la porte
      # repondait 200, la maquette « Not Found »).
      #
      # Ce que le smoke prouve, en 60 s maximum :
      #   1. le compte-rendu de pret (COOKDRIVE_READY_FILE pose par main.cjs)
      #      apparait ET GET /api/settings repond 200 ;
      #   2. le jeton d'instance du compte-rendu == l'en-tete X-Cookdrive-Instance
      #      de la reponse — on sonde NOS serveur, pas un herite du port ;
      #   3. GET / repond 200 et rend l'UI embarquee (<div id="root">).
      # A l'echec : les 40 dernieres lignes du log du serveur (pas un rouge muet).
      #
      # Windows (.exe) et macOS (.dmg) : PAS de smoke — l'execution headless
      # d'un installeur NSIS/dmg n'est pas implantee. Ce bloc NOMME le manque
      # au lieu de laisser croire que les trois plateformes sont couvertes.
      - name: smoke AppImage (le serveur empaquete repond en 60 s)
        shell: bash
        timeout-minutes: 10
        env:
          SMOKE_PORT: "3997"
          SMOKE_TMP: ${{ runner.temp }}/clausio-smoke
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libnss3 libgbm1 \
            libatk-bridge2.0-0t64 libcups2t64 libgtk-3-0t64 libasound2t64
          APPIMAGE="$(ls release/*.AppImage)"
          echo "== AppImage juge : $APPIMAGE"
          mkdir -p "$SMOKE_TMP"
          rm -f "$SMOKE_TMP/cookdrive-ready.json" "$SMOKE_TMP/smoke.log" \
                /tmp/cookdrive-ready.json
          # main.cjs pose son compte-rendu dans app.getPath('temp') : TMPDIR le
          # borne vers un dossier qu'on relit. PORT est un CONTRAT : impose, le
          # serveur meurt sur EADDRINUSE au lieu de glisser en silence.
          export TMPDIR="$SMOKE_TMP" PORT="$SMOKE_PORT"
          xvfb-run -a "$APPIMAGE" --appimage-extract-and-run --no-sandbox \
            --disable-gpu > "$SMOKE_TMP/smoke.log" 2>&1 &
          APP_PID=$!

          echec() {
            echo "::error::SMOKE ECHEC — $1"
            echo "===== 40 dernieres lignes du log de l'AppImage ====="
            tail -n 40 "$SMOKE_TMP/smoke.log" || true
            kill $APP_PID 2>/dev/null || true
            exit 1
          }

          # 1) compte-rendu de pret + GET /api/settings -> 200, en 60 s
          ok=""
          fin=$((SECONDS + 60))
          while [ $SECONDS -lt $fin ]; do
            kill -0 $APP_PID 2>/dev/null || echec "l'AppImage est mort avant de repondre"
            if [ -f "$SMOKE_TMP/cookdrive-ready.json" ]; then
              curl -fsS -m 3 -o /dev/null \
                "http://127.0.0.1:$SMOKE_PORT/api/settings" && ok=1 && break
            fi
            sleep 2
          done
          [ -n "$ok" ] || echec "aucun compte-rendu + 200 sur /api/settings en 60 s"
          echo "== compte-rendu de pret recu + /api/settings -> 200"

          # 2) identite : jeton du compte-rendu == en-tete X-Cookdrive-Instance
          attends="$(python3 -c "import json;print(json.load(open('$SMOKE_TMP/cookdrive-ready.json'))['instance'])")"
          rendu="$(curl -fsS -m 3 -D - -o /dev/null \
            "http://127.0.0.1:$SMOKE_PORT/api/settings" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="x-cookdrive-instance"{print $2}')"
          if [ "$attends" != "$rendu" ]; then
            echec "jeton d'instance divergent (compte-rendu != en-tete) — on sondait un autre serveur"
          fi
          echo "== identite verifiee (jeton $attends)"

          # 3) GET / -> 200 avec l'UI embarquee. Le corps est tamponne avant le
          #    grep : `curl | grep -q` ferait quitter grep tot -> SIGPIPE -> curl
          #    rend 141 sous pipefail = faux rouge. Ici seul curl -f decide du 200.
          corps="$(curl -fsS -m 3 "http://127.0.0.1:$SMOKE_PORT/")"
          case "$corps" in
            *'<div id="root">'*) : ;;
            *) echec "GET / ne rend pas <div id=\"root\"> (l'UI empaquetee est absente)" ;;
          esac
          echo "== GET / rend l'UI embarquee (<div id=\"root\">)"

          echo "SMOKE OK — AppImage : /api/settings 200, jeton conforme, UI rendue"
          kill $APP_PID 2>/dev/null || true

      - name: à quelle release rattacher
        id: rel
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: attacher les installeurs à la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: |
            release/*.AppImage
            release/*.deb
