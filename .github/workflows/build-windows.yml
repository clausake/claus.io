# Installeurs des trois plateformes — chacun compile sur son hote NATIF.
#
# Windows x64 : sur un vrai hote Windows (makensis casse en EPIPE depuis Linux,
#               et le cross-compile arm64->x64 est refuse pour les modules natifs).
# macOS arm64 : sur un runner Apple (une regle de facto d'Apple pour les images disque).
# Linux arm64 : sur un runner ARM (le cross-compile x64->arm64 est refuse pour
#               sqlite3/argon2/onnxruntime/@napi-rs/canvas).
#
# Declencheurs :
#   - manuel (workflow_dispatch) pour la release en cours ;
#   - à chaque tag v* pour les releases suivantes.
# L'attache à la release LIT la version de package.json pour un déclenchement
# manuel (le dispatch ne porte pas de tag) : un numéro figé à la main attacherait
# les installeurs neufs à l'ANCIENNE release — exactement ce qui est arrivé à
# v0.1.0, dont les assets ont été remplacés au fil des corrections sans que la
# version annoncée bouge. Le tag porté par le déclencheur v* reste la référence
# quand il existe.

name: installateurs

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Bug npm #4828 : les dépendances optionnelles par-plateforme (rollup,
      # esbuild) ne sont pas installées si le lockfile a été généré ailleurs.
      # On installe nos petits binaires natifs Windows à plat sans toucher au
      # lockfile (le poste local est Linux).
      - name: native rollup/esbuild (npm bug #4828)
        run: npm i --no-save @rollup/rollup-win32-x64-msvc @esbuild/win32-x64

      # electron-rebuild ne reconnaît pas les noms de prébuilds NAPI modernes
      # d'argon2 (0.45 livre « argon2.glibc.node », le détecteur cherche
      # « node.napi.node ») : sans la copie, il retombe sur node-gyp et exige
      # Visual Studio. La copie est device-independante : NAPI s'exécute tel
      # quel sous Electron.
      - name: argon2 — prébuild NAPI visible par electron-rebuild
        shell: bash
        run: |
          cp node_modules/argon2/prebuilds/win32-x64/argon2.glibc.node \
             node_modules/argon2/prebuilds/win32-x64/node.napi.node

      - run: npm run build

      - run: npm run build:server

      - name: electron-builder NSIS (x64, sans publication)
        run: npx electron-builder -w --publish never

      - name: à quelle release rattacher
        id: rel
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: attacher l'installeur à la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: release/*.exe

  build-mac:
    # Le .dmg ne se compile QUE sur une machine Apple (une règle de facto
    # d'Apple sur les outils de création d'images disque macOS) : on passe
    # par un runner GitHub Actions Apple Silicon (macOS 14/15 arm64).
    # Sans certificat de développeur Apple : le .dmg est non signé, l'utilisateur
    # devra confirmer à la main à la première ouverture (clic droit → Ouvrir).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le même bug npm #4828 que sous Windows : les paquets optionnels par
      # plateforme (rollup, esbuild) manquent si le lockfile a été généré
      # ailleurs. Le runner est Apple Silicon (darwin-arm64).
      - name: native rollup/esbuild (npm bug #4828)
        run: npm i --no-save @rollup/rollup-darwin-arm64 @esbuild/darwin-arm64

      - run: npm run build

      - run: npm run build:server

      - name: electron-builder DMG (Apple Silicon, sans publication)
        run: npx electron-builder -m --publish never

      - name: à quelle release rattacher
        id: rel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: attacher l'installeur à la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: release/*.dmg

  build-linux:
    # Linux ARM64 (AppImage + deb) — construit sur un runner ARM natif.
    #
    # POURQUOI CE JOB EXISTE (defaut mesure le 30/10 sur la release v0.1.1) :
    # le README annoncait des installeurs Linux attaches, mais la release ne
    # portait que le .exe et le .dmg — les AppImage/.deb avaient ete construits
    # a la main sur le poste arm64 et jamais pousses. Un utilisateur Linux qui
    # suivait le README (« prendre 0.1.1 ou plus recent ») retombait donc sur la
    # 0.1.0, celle qui ouvre « Not Found » (chantier 20). Les deux assets 0.1.1
    # ont ete rattaches a la main le 31/10 ; ce job empeche la recidive.
    #
    # Pourquoi un runner ARM et pas ubuntu-latest (x64) : le cross-compile
    # x64->arm64 est impossible pour les modules natifs (sqlite3, argon2,
    # onnxruntime, @napi-rs/canvas) — npm ci installerait les binaires x64.
    # Les runners ARM heberges sont disponibles pour les depots publics.
    runs-on: ubuntu-24.04-arm
    # Meme raison que dans ci.yml : le postinstall de onnxruntime-node telecharge
    # les providers CUDA/TensorRT depuis le CDN Microsoft, injoignable depuis le
    # runner (ETIMEDOUT). Les binaires CPU linux/arm64 sont deja dans le paquet.
    env:
      ONNXRUNTIME_NODE_INSTALL: "skip"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run build:server

      - name: electron-builder AppImage + deb (arm64, sans publication)
        run: npx electron-builder -l --publish never

      # ── E1 : smoke test de l'installeur (plan docs/plan-chantier-qwen-2026-11-02-v012.md)
      #
      # Le serveur EMPAQUETE doit repondre : on lance le VRAI AppImage (jamais
      # `tsx server.ts` du source) sous xvfb et on sonde son API. Un smoke en
      # continue-on-error, ou un vert sans sonde, est INTERDIT par le plan.
      # Il vit AVANT l'attache a la release : un installeur dont le serveur ne
      # repond pas ne doit pas etre publie (c'etait le defaut v0.1.0 : la porte
      # repondait 200, la maquette « Not Found »).
      #
      # Ce que le smoke prouve, en 60 s maximum :
      #   1. le compte-rendu de pret (COOKDRIVE_READY_FILE pose par main.cjs)
      #      apparait ET GET /api/settings repond 200 ;
      #   2. le jeton d'instance du compte-rendu == l'en-tete X-Cookdrive-Instance
      #      de la reponse — on sonde NOS serveur, pas un herite du port ;
      #   3. GET / repond 200 et rend l'UI embarquee (<div id="root">).
      # A l'echec : les 40 dernieres lignes du log du serveur (pas un rouge muet).
      #
      # Windows (.exe) et macOS (.dmg) : PAS de smoke — l'execution headless
      # d'un installeur NSIS/dmg n'est pas implantee. Ce bloc NOMME le manque
      # au lieu de laisser croire que les trois plateformes sont couvertes.
      - name: smoke AppImage (le serveur empaquete repond en 60 s)
        shell: bash
        timeout-minutes: 10
        env:
          SMOKE_PORT: "3997"
          SMOKE_TMP: ${{ runner.temp }}/clausio-smoke
        run: |
          set -euo pipefail
          # CHRONOMETRE + VERITE SUR LE CAPTEUR (mesure du 11/11, run
          # 43049934179, job build-linux). Le log du job compte 359 lignes ; la
          # 277e est `sudo apt-get update -qq` et le journal de l'etape
          # s'ARRETE la : AUCUNE ligne `Get:`/`Unpacking`/`Setting up`, et MEME
          # PAS les `echo` du propre script de l'etape. GitHub rend la
          # sortie d'une etape qu'A LA FIN de cette etape : une etape JIGEE ne
          # rend donc que le echoing du script, jamais ce qu'ont produit les
          # commandes. Un rouge ici est un mur de 600 s sans temoin. Ce bloc
          # rend le temoin possible et nomme l'outil qui le donne.
          set -x                  # bash -x : CHAQUE commande est ecrite AVANT
                                  # d'etre jouee. Une etape jigee revele ainsi
                                  # LA commande exacte ou la pendule s'est arrete.
          t0=$SECONDS
          horloge() { echo "== +$((SECONDS - t0))s  $1"; }
          horloge "debut"
          # Mesure du 11/11 sur ce poste (le MEME AppImage 1.0.7, le MEME
          # xvfb-run) : le compte-rendu de pret etait ecrit et GET
          # /api/settings repondait 200 EN MOINS DE 45 s (435 lignes de log
          # serveur). Les 60 s de la boucle ne sont DONC PAS la cause du rouge.
          # Ce qui reste en cause possible : `apt-get update` sur le miroir
          # Ubuntu ARM — le seul appel reseau de l'etape, et deja vu mourir en
          # ETIMEDOUT sur ce depot (le CDN Microsoft, chantier 48). D'ou : on
          # n'appelle apt-get QUE pour ce qui MANQUE vraiment.
          # PIEGE MESURE DU 11/11 : `ldconfig -p | grep libnss3` rend VIDE sur
          # ce poste ALORS QUE le paquet est installe (`dpkg -l` = 1) et que
          # l'AppImage y demarre en 45 s. Une absence declaree par ldconfig est
          # DONC UN FAUX POSITIF, et elle ferait tourner un apt-get inutile —
          # exactement le temps que la porte est censee economiser. La sonde
          # officielle est `dpkg -s` : son rc est le fait.
          manque=""
          command -v xvfb-run >/dev/null 2>&1 || manque="$manque xvfb"
          for biblio in libnss3 libgbm1 libatk-bridge2.0-0t64 libcups2t64 \
                        libgtk-3-0t64 libasound2t64; do
            dpkg -s "$biblio" >/dev/null 2>&1 || manque="$manque $biblio"
          done
          horloge "paquets absents: [$manque]"
          if [ -n "$manque" ]; then
            # Pas de -qq ici : -qq avec Dpkg::Use-Pty=0 est justement ce qui
            # rend 0 ligne sur 600 s (mesure du 11/11). Chaque paquet installe
            # doit laisser sa trace dans le journal.
            sudo apt-get -o Dpkg::Use-Pty=0 update
            # shellcheck disable=SC2086
            sudo apt-get -o Dpkg::Use-Pty=0 install -y $manque
            horloge "apt-get termine"
          else
            horloge "apt-get SAUTE (les six paquets sont deja poses)"
          fi
          APPIMAGE="$(ls release/*.AppImage)"
          echo "== AppImage juge : $APPIMAGE"
          mkdir -p "$SMOKE_TMP"
          rm -f "$SMOKE_TMP/cookdrive-ready.json" "$SMOKE_TMP/smoke.log" \
                /tmp/cookdrive-ready.json
          # main.cjs pose son compte-rendu dans app.getPath('temp') : TMPDIR le
          # borne vers un dossier qu'on relit. PORT est un CONTRAT : impose, le
          # serveur meurt sur EADDRINUSE au lieu de glisser en silence.
          export TMPDIR="$SMOKE_TMP" PORT="$SMOKE_PORT"
          xvfb-run -a "$APPIMAGE" --appimage-extract-and-run --no-sandbox \
            --disable-gpu > "$SMOKE_TMP/smoke.log" 2>&1 &
          APP_PID=$!
          horloge "AppImage lance (xvfb-run en arriere-plan)"

          echec() {
            echo "::error::SMOKE ECHEC — $1"
            echo "===== 40 dernieres lignes du log de l'AppImage ====="
            tail -n 40 "$SMOKE_TMP/smoke.log" || true
            kill $APP_PID 2>/dev/null || true
            exit 1
          }

          # 1) compte-rendu de pret + GET /api/settings -> 200, en 60 s
          ok=""
          fin=$((SECONDS + 60))
          while [ $SECONDS -lt $fin ]; do
            kill -0 $APP_PID 2>/dev/null || echec "l'AppImage est mort avant de repondre"
            if [ -f "$SMOKE_TMP/cookdrive-ready.json" ]; then
              curl -fsS -m 3 -o /dev/null \
                "http://127.0.0.1:$SMOKE_PORT/api/settings" && ok=1 && break
            fi
            sleep 2
          done
          [ -n "$ok" ] || echec "aucun compte-rendu + 200 sur /api/settings en 60 s"
          horloge "compte-rendu de pret recu + /api/settings -> 200"

          # 2) identite : jeton du compte-rendu == en-tete X-Cookdrive-Instance
          attends="$(python3 -c "import json;print(json.load(open('$SMOKE_TMP/cookdrive-ready.json'))['instance'])")"
          rendu="$(curl -fsS -m 3 -D - -o /dev/null \
            "http://127.0.0.1:$SMOKE_PORT/api/settings" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="x-cookdrive-instance"{print $2}')"
          if [ "$attends" != "$rendu" ]; then
            echec "jeton d'instance divergent (compte-rendu != en-tete) — on sondait un autre serveur"
          fi
          echo "== identite verifiee (jeton $attends)  (+$((SECONDS - t0))s)"

          # 3) GET / -> 200 avec l'UI embarquee. Le corps est tamponne avant le
          #    grep : `curl | grep -q` ferait quitter grep tot -> SIGPIPE -> curl
          #    rend 141 sous pipefail = faux rouge. Ici seul curl -f decide du 200.
          corps="$(curl -fsS -m 3 "http://127.0.0.1:$SMOKE_PORT/")"
          case "$corps" in
            *'<div id="root">'*) : ;;
            *) echec "GET / ne rend pas <div id=\"root\"> (l'UI empaquetee est absente)" ;;
          esac
          echo "== GET / rend l'UI embarquee (<div id=\"root\">)"

          echo "SMOKE OK — AppImage : /api/settings 200, jeton conforme, UI rendue"
          kill $APP_PID 2>/dev/null || true

      - name: à quelle release rattacher
        id: rel
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      # ── LE FICHIER DE SOMMES EST UN CONTRAT DU README, PAS UN ORNEMENT
      # (mesure du 11/11 : v1.0.7 a ete publiee avec ses quatre installeurs et
      # SANS SOMMES-SHA256.txt ; `grep -rn SOMMES .github/` rendait VIDE — le
      # fichier de v1.0.6 avait ete attache A LA MAIN, cinq minutes apres le
      # dernier asset. Un contrat promis au client et tenu a la main une fois
      # sur deux est un contrat faux.)
      #
      # Il est ICI, dans le job linux, pour une raison mesuree : les trois jobs
      # s'attachent a la MEME release (`tag_name` lu dans package.json) mais
      # chacun ne voit QUE ses fichiers sous release/, et ils tournent en
      # PARALLELE. Aucun job ne peut donc sommer les quatre fichiers : les
      # trois premiers ne sont pas sur sa machine. Ce que ce job peut garantir,
      # c'est ce qu'il produit — d'ou une etape PAR JOINTURE (exe, dmg, ici
      # AppImage + deb) et une ATTACHE DEDIEE QUI FUSIONNE : le fichier joint
      # porte les QUATRE lignes, et une jointure dont un fichier attendu est
      # absent fait ROUGIR l'etape au lieu de produire un fichier incomplet
      # qui rassure pour rien.
      #
      # LES SOMMES PORTENT LES OCTETS PUBLES, PAS UNE INTENTION : electron-builder
      # re-ecrit les block maps embarquees apres son propre hash. La somme est
      # donc calculee sur le fichier qui part, dans la MEME etape que
      # l'attachement. Cote client, la contre-verif est ecrite dans le README
      # (sha256sum / Get-FileHash) ; la porte verify:sommes-release rejoue le
      # calcul sur les octets reellement telecharges.
      - name: SOMMES-SHA256.txt (les octets publies, liste fermee)
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # Liste FERMEE : les DEUX fichiers de ce job doivent exister, sinon
          # le fichier de sommes serait incomplet — et un fichier incomplet est
          # pire qu'un fichier absent (il rassure pour rien).
          a="release/claus.io-${version}-arm64.AppImage"
          d="release/clausio_${version}_arm64.deb"
          for f in "$a" "$d"; do
            [ -s "$f" ] || { echo "::error::$f absent ou vide — AppImage et deb sont le contrat de ce job"; exit 1; }
          done
          ( cd release && sha256sum "$(basename "$a")" "$(basename "$d")" ) > release/SOMMES-SHA256.txt
          echo "== contenu de SOMMES-SHA256.txt (les octets qui partent) :"
          cat release/SOMMES-SHA256.txt
          [ "$(wc -l < release/SOMMES-SHA256.txt)" -eq 2 ] || { echo "::error::2 lignes attendues"; exit 1; }
          # on nomme les lignes des AUTRES jobs deja publiees sur cette release
          # (information du journal : la fusion se fait a l'etape suivante).
          gh release view "v${version}" --json assets -q '.assets[].name' || true

      - name: joindre la release (installeurs + SOMMES fusionnes des trois jobs)
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # ATTENTE BORNEE : les trois jobs sont en PARALLELE, les deux autres
          # joints peuvent arriver apres. 12 tentatives x 20 s = 4 min, puis
          # on ROUGIT en nommant ce qui manque (un wait infini est exactement le
          # defaut du smoke AppImage corrige plus haut dans ce meme fichier).
          manquants=""
          for i in $(seq 1 12); do
            manquants=""
            for n in "claus.io.Setup.${version}.exe" "claus.io-${version}-arm64.dmg"; do
              gh release download "v${version}" -p "$n" -D release --clobber >/dev/null 2>&1 \
                || manquants="$manquants $n"
            done
            [ -z "$manquants" ] && break
            echo "== en attente des joints des autres jobs ($i/12) :$manquants"
            sleep 20
          done
          [ -z "$manquants" ] || { echo "::error::joints absents apres 4 min :$manquants"; exit 1; }
          # FUSION : les lignes de CE job (celles qui viennent d'etre calculees
          # sur les octets presents ici) + les lignes recalculees sur les
          # fichiers telecharges, soit les quatre.
          ( cd release && sha256sum "claus.io.Setup.${version}.exe" \
                                   "claus.io-${version}-arm64.dmg" ) \
            > release/SOMMES-SHA256.txt.tmp
          cat release/SOMMES-SHA256.txt >> release/SOMMES-SHA256.txt.tmp
          mv release/SOMMES-SHA256.txt.tmp release/SOMMES-SHA256.txt
          echo "== SOMMES-SHA256.txt final (4 lignes attendues) :"
          cat release/SOMMES-SHA256.txt
          [ "$(wc -l < release/SOMMES-SHA256.txt)" -eq 4 ] || { echo "::error::4 lignes attendues"; exit 1; }

      - name: attacher les installeurs à la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: |
            release/*.AppImage
            release/*.deb
            release/SOMMES-SHA256.txt
