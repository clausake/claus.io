# CI claus.io — le juge automatique qui rougit sur tout defaut.
#
# Regles heritees du poste local (PHASES.md) :
#  - un job rouge sans artifact est AVEUGLE : chaque job echoue laisse ses
#    traces, captures et rapports (paths: test-results/, test/*.out).
#  - le verdict est LU (rc propres par porte), jamais infere d'une chaine shell.
#  - la morsure verify:types-mord PROUVE que la porte rougit : si un :any
#    revient dans le backend, la CI devient rouge. Sans elle, une porte verte
#    ne prouve rien (porte qui ne pique pas = porte decorative).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Le poste GitLab (.gitlab-ci.yml) pose DEJA cette variable, pas GitHub Actions.
# Sans elle, `npm ci` execute le postinstall de onnxruntime-node, qui telecharge
# les providers CUDA/TensorRT depuis le CDN Microsoft (api.nuget.org) : le CDN est
# injoignable depuis le runner GitHub — ETIMEDOUT, et le job « gates » rougit sur
# `Run npm ci` AVANT d'avoir juge quoi que ce soit. Mesure le 30/10 sur le run
# 40996854754 (seul job rouge de la CI, les sept autres verts). Les binaires CPU
# linux/x64 sont deja dans le paquet (node_modules/onnxruntime-node/bin/napi-v6/
# linux/x64) : l'OCR tourne sur CPU, le skip ne retire aucune capacite jugee.
# Le defaut etait la : la variable etait consolee sur GitLab et oubliee sur
# GitHub — deux harnais, une seule moitie protegee (la regle des deux directions).
env:
  ONNXRUNTIME_NODE_INSTALL: "skip"

jobs:
  # ── Lot 1 : statique ──────────────────────────────────────────────────────
  types:
    name: types (tsc 0 + zero :any + morsure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tsc --noEmit (0 erreur)
        run: npm run lint
      - name: verify:types (zero :any backend, seuil 0)
        run: npm run verify:types
      - name: verify:types-mord (la porte rougit si un :any revient)
        run: npm run verify:types-mord
      - name: verify:ocr-modeles (empreintes des poids embarques)
        run: npm run verify:ocr-modeles

  build:
    name: build (vite, seuil bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build
        run: npm run build
      - name: verify:bundle (chunk features reference, pas de motion lourd)
        run: npm run verify:bundle
      - name: seuil bundle < 620 ko
        run: |
          KO=$(stat -c %s dist/assets/index-*.js | head -1)
          KO=$((KO / 1024))
          echo "index-*.js = ${KO} ko"
          if [ "$KO" -ge 620 ]; then
            echo "::error::bundle ${KO} ko >= 620 ko (seuil CI)"
            exit 1
          fi

  # ── Lot 2 : unites ────────────────────────────────────────────────────────
  vitest:
    name: vitest (158 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=default
      - name: artifact vitest (si rouge)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-output
          path: |
            test-results/
          if-no-files-found: ignore

  # ── Lot 3 : journal + portes python (rapides, sans serveur) ──────────────
  journal:
    name: journal (verify:split anti-perte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/decouper-phases.py --verify

  # ── Lot 4 : contrats e2e (serveur isole par spec) ────────────────────────
  e2e:
    name: e2e (playwright contrats + routes)
    runs-on: ubuntu-latest
    steps:
      # lfs: true : le test guide-download juge le VRAI PDF (pas un pointeur
      # LFS). Sans smudge, public/Executive_Guide.pdf est un fichier texte de
      # 130 octets et la porte rougit — la lecon du contrat scelle 7cc8630e.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: playwright install (chromium)
        run: npx playwright install --with-deps chromium
      - name: verify:routes (46 routes, serveur isole PORT=3999)
        run: npm run verify:routes
      - name: artifact e2e (traces/captures si rouge)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          retention-days: 7

  # ── Lot 5 : lot complet des portes (le meme verdict que le poste) ────────
  gates:
    # Pas de COMPTE dans ce libelle : « 86 portes » y est reste ecrit alors que
    # le lot en comptait 90 (mesure du 30/10) — un nombre annonce dans une
    # etiquette se perime en silence, exactement comme les BUDGETS recopies
    # d'audit-perf.mjs. Le compte qui fait foi est celui que rend
    # `scripts/lire-gates.py` a la fin du job, pas un libelle.
    name: gates (le lot complet, run-all-gates)
    runs-on: ubuntu-latest
    needs: [types, build, vitest, journal]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium requis : verify:reception (spec avec fixture page) lance un
      # navigateur reel. Les jobs GitHub sont isoles — l'installation du job
      # e2e ne se partage pas. --with-deps pose les bibliotheques systeme.
      - name: playwright install (chromium)
        run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # dist/ requis : verify:http (en-tetes de cache sur les assets),
      # verify:bundle (lit dist/assets) et verify:reception (spec qui juge
      # l'UI embarquee) refusent de tourner sans build — meme contrat que le
      # poste local ("lancer npm run build avant ce script").
      - name: build (prealable au lot complet)
        run: npm run build
      - name: verify:all (le lot complet, verdict LU)
        run: npm run verify:all
      - name: resume portes
        if: always()
        run: python3 scripts/lire-gates.py || true
      - name: artifact gates.out (le verdict consigne)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-output
          path: test/gates*.out
          retention-days: 7
