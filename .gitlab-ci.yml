# CI GitLab - verification lint + build + test
image: node:22

stages:
  - verify
  - test

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

lint:
  stage: verify
  script:
    - npm ci --cache .npm --prefer-offline
    - npx tsc --noEmit

build:
  stage: verify
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# --- Tests ---
# Unitaires (vitest) : utilitaires partagés (safeJsonParse, prix, matching flou, modèle Ollama).
unit-test:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npx vitest run

# E2E (Playwright) : démarre le serveur Express (tsx) sur un port isolé et
# vérifie les routes critiques (CRUD inventaire, licence, dashboard, HACCP).
# Le runner doit permettre les ports locaux (pas de problème sur runner docker).
e2e-test:
  stage: test
  # ⚠ `needs: [build]` est une OBLIGATION depuis que test/e2e/motion-animation
  # .spec.ts existe, et le pipeline #2831926289 l'a prouve en rougissant : la
  # suite e2e est lancee sans le `dist/` du job `build`, or ce harnais (a) exige
  # dist/index.html et (b) demarre le serveur en NODE_ENV=production, la seule
  # branche qui sert le vrai bundle. Sans l'artefact, le job echoue sur
  # « dist/ absent » et n'execute meme pas le reste de la suite.
  #
  # Le piege etait total en local : `dist/` traine dans l'arborescence de
  # developpement, donc la suite passait ici et rougissait la haut. La legon
  # (consigne utile, du manuel des pipelines): un test qui depend d'un
  # artefact doit declarer le job qui le produit, et on le VERIFIE en
  # supprimant l'artefact (make dist-reproduce dist/rm), pas en le laissant
  # trainer dans l'arbre.
  needs: [build]
  script:
    - npm ci --cache .npm --prefer-offline
    - npx playwright test

# Preuves terrain (verify:*). Ces scripts ne testent pas une fonction, ils
# empechent un REGRESSION de contrat : latence par route, gzip + cache des assets,
# diffusion SSE, budgets de rate-limit, et poids du chunk d'entree. Ils demarrent
# leur propre serveur sur un port isole (comme la suite e2e) et exigent le `dist`
# reel pour ceux qui exercent la branche `NODE_ENV=production` -> artifacts dist/.
# Un reglage de perf qui change sans passer par la est un reglage non verifie.
verify-test:
  stage: test
  needs: [build]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run verify:bundle
    - npm run verify:http
    - npm run verify:perf
    - npm run verify:sse
    - npm run verify:ratelimit
  artifacts:
    paths:
      - dist/
    when: always
